<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>標準読書テンプレートv2｜文章・画像</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",system-ui,sans-serif;background:#f7f8f3;color:#28373a}
*{box-sizing:border-box}
body{margin:0;padding:26px 18px 60px}
main{max-width:600px;margin:auto}
h1{font-size:23px;line-height:1.4;margin:16px 0 12px}
p{font-size:14px;line-height:1.8;color:#5c6b6d}
a{color:#254e52}
.cards{display:grid;gap:12px;margin:22px 0}
.card{display:block;text-decoration:none;color:#263d3e;background:#fff;border:1px solid #cddbd4;border-radius:15px;padding:20px}
.card strong{display:block;font-size:19px;margin-bottom:8px}
.card small{color:#718285;line-height:1.7}
.note{padding:12px;border:1px solid #dae0d8;border-radius:12px;background:#fffdf8}
</style>
</head>
<body>
<main>
<p><a href="../../../reader/library/">◀ 本棚へ</a></p>
<h1>標準読書テンプレートv2</h1>
<p>『世界の歴史1』の読書画面を基準にした、今後の本のための2つの見本です。</p>
<div class="cards">
<a class="card" href="./text.html"><strong>文章のテンプレート</strong><small>明朝体20px・右から左の縦書き、自然な改ページ、文字サイズ変更、上下バー</small></a>
<a class="card" href="./mixed.html"><strong>文章＋画像の混在テンプレート</strong><small>本文と原本画像・図説を1冊の中で順に表示</small></a>
<a class="card" href="./image.html"><strong>画像のテンプレート</strong><small>原本画像を変更せず表示。画像だけのページ／画像を固定して説明文だけ送るページ</small></a>
</div>
<p class="note">ここに実際の本の文章や原本写真は含まれていません。画像版では、端末内のJPEG・PNGを選んで表示確認できます。現行の本棚や保存済みの書籍は変更していません。</p>
<p><a href="./README.md">使い方・検査方法</a></p>
</main>
</body>
</html>
