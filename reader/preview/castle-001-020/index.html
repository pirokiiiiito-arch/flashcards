 return {book,summary:{schema:book.schema,title:book.title,range:book.range,pages:20,groups:book.groups.length,legacy,sources}};
}
function db(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('このブラウザーでは端末保存を利用できません。'));const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function readSaved(){const d=await db();try{return await new Promise((resolve,reject)=>{const t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).get(DB_KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}finally{d.close();}}
async function save(book,name,token){if(token!==importNumber)return;storageState='saving';const d=await db();try{if(token!==importNumber)return;await new Promise((resolve,reject)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put({book,name,savedAt:new Date().toISOString(),version:2},DB_KEY);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('保存が中断されました。'));});if(token===importNumber){storageState='saved';status('この端末に保存しました');saveNumber=token;log('saved_after_visible',{token});}}finally{d.close();}}
function htmlFor(book){return READER.replace('{{READER_DATA}}',()=>JSON.stringify(book).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029'));}
async function mount(book,name,token){loadState='opening';childReady=false;for(const task of pending.values())task.resolve({superseded:true});pending.clear();const oldURL=currentURL;currentSession=crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');sequence=0;const session=currentSession,blob=new Blob([htmlFor(book)],{type:'text/html'});currentURL=URL.createObjectURL(blob);const f=document.createElement('iframe');f.title=TITLE+' 読書ページ';f.setAttribute('sandbox','allow-scripts');f.setAttribute('allow','fullscreen');f.src=currentURL+'#'+new URLSearchParams({reader_session:session,parent_origin:location.origin}).toString();currentFrame=f;currentBook=book;openedName=name;const wait=new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{pending.delete(session);reject(Error('本を開くのに時間がかかっています。ファイルを選び直してください。'));},90000);pending.set(session,{resolve:v=>{clearTimeout(timeout);resolve(v);},reject:e=>{clearTimeout(timeout);reject(e);}});});f.addEventListener('load',()=>sendViewport('iframe-load'));$('frame-area').replaceChildren(f);if(oldURL)URL.revokeObjectURL(oldURL);$('frame-area').hidden=false;$('intro').hidden=true;$('error').textContent='';sendViewport('mount');await wait;if(token!==importNumber)return {superseded:true};await nextFrame();if(token!==importNumber)return {superseded:true};loadState='open';lastError='';log('painted_before_save',{token});return {opened:true,pages:book.pages.length,legacy:!!book.legacy_import};}
async function importText(input,name='読書HTML.html',options={}){const token=++importNumber;status('原本を確認しています…');loadState='validating';let text=input;if(input instanceof Blob){text=await input.text();name=input.name||name;}const result=await validate(text);if(token!==importNumber)return {superseded:true};diagnostics.validation=result.summary;diagnostics.legacy=result.summary.legacy;const mounted=await mount(result.book,name,token);if(token!==importNumber)return mounted;if(options.restore){storageState='saved';status(result.summary.legacy?'保存した旧版を開きました':'保存した本を開きました');}else{status('本を開きました。端末に保存しています…');await save(result.book,name,token).catch(error=>{if(token!==importNumber)return;storageState='failed';status('本を開きました。次回もHTMLを選んでください');log('save_failed',String(error));});}return {...mounted,validation:result.summary,storage:storageState};}
async function choose(file){if(!file)return;const token=importNumber+1;try{await importText(file);}catch(error){if(token===importNumber)fail(error);}}
$('open-top').addEventListener('click',()=>$('file').click());$('open-main').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',()=>{choose($('file').files[0]);$('file').value='';});
window.__loaderTest={validate:async input=>{const text=input instanceof Blob?await input.text():input;return (await validate(text)).summary;},importText,extract,getState:()=>({loadState,openedName,storageState,importNumber,saveNumber,childReady,session:currentSession,scale:viewport(),error:lastError,legacy:!!currentBook?.legacy_import}),getDiagnostics:()=>({...diagnostics}),getFrame:()=>currentFrame};
(async()=>{let restoreToken=0;try{const saved=await readSaved();if(saved&&importNumber===0){status('保存した本を開いています…');restoreToken=importNumber+1;await importText(saved.book,saved.name||'保存した読書HTML',{restore:true});}else if(!saved&&importNumber===0&&typeof indexedDB.databases==='function'){const databases=await indexedDB.databases();if(databases.some(d=>d.name==='castle-drivezip-reader-v1')&&importNumber===0){diagnostics.legacySavedDatabaseDetected=true;status('旧版の端末保存があります。読書HTMLを選び直してください');$('error').textContent='保存済みの旧版ZIPはそのまま残っています。新しい読書HTMLを選ぶと、この入口でも続けて読めます。';}}}catch(error){if(importNumber===0){storageState='unavailable';status('読書HTMLを選んでください');log('restore_unavailable',String(error));}else if(restoreToken===importNumber)fail(error);}})();
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(async registration=>{const worker=registration.active||registration.waiting||registration.installing;if(!worker)return;const send=()=>worker.postMessage({type:'CACHE_READER_SHELL',url:location.href.split('#')[0]});if(worker.state==='activated')send();else worker.addEventListener('statechange',()=>{if(worker.state==='activated')send();});}).catch(()=>{});
})();
