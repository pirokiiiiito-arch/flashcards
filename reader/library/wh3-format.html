<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>読書</title>
<style>

:root{
  --size:20px;--lh:1.50;--one-column:30px;
  --paper:#fffdf7;--ink:#273034;--muted:#718084;--accent:#925341;
  --background:#ecefeb;--rule:#d8ded9
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%;width:100%;touch-action:manipulation}
body{margin:0;width:100%;min-height:0;height:100svh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #2f8190;outline-offset:3px}
.toolbar{flex:0 0 auto;padding:calc(5px + env(safe-area-inset-top)) 11px 5px;background:#f8f9f5;border-bottom:1px solid #d9ded8}
.toolbar-line{display:flex;max-width:520px;margin:auto;justify-content:space-between;align-items:center;gap:10px}
.brand{min-width:0;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.brand strong{font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.brand small{font-size:10px;color:#69777b;letter-spacing:0}
.head-actions{display:flex;align-items:center;gap:7px}
.nav-button,.size-button{border:1px solid #d5ded9;background:white;border-radius:10px;min-height:42px;padding:7px 10px;white-space:nowrap}
.nav-button{font-size:13px}
.font-control{display:flex;align-items:center;gap:2px;border:1px solid #d5ded9;border-radius:11px;background:#fff;padding:2px}
.size-button{border:0;min-height:39px;background:transparent;border-radius:8px;padding:5px 10px;font-size:17px;font-weight:600}
.size-button:disabled{color:#adb6b6;cursor:default}
#current-size{font-size:12px;min-width:40px;text-align:center;font-variant-numeric:tabular-nums;color:#53676d}
.reader-main{flex:1;min-height:0;width:100%;display:flex;align-items:stretch;justify-content:center;padding:0;overflow:hidden;overscroll-behavior:contain;touch-action:pan-x pinch-zoom}
.sheet{position:relative;flex:1 1 auto;width:100%;max-width:520px;height:100%;min-height:0;background:var(--paper);border:0;border-radius:0;padding:10px 12px;box-shadow:none;overflow:hidden}
.reading-stage{position:relative;width:100%;height:100%;min-height:0}
.text-flow{writing-mode:vertical-rl;text-orientation:mixed;width:calc(100% - var(--one-column));height:100%;margin-left:auto;overflow:hidden;font-size:var(--size);line-height:var(--lh);font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif CJK JP',serif;color:#263039;letter-spacing:0;line-break:strict;word-break:normal;overflow-wrap:anywhere;white-space:normal}
.text-flow p,.text-flow h2{padding:0;border:0;white-space:normal;overflow-wrap:anywhere;line-height:inherit}
.text-flow p{font-size:1em;margin:0 0 .72em 0;text-indent:1em;font-weight:400}
.text-flow p.continued{text-indent:0}
.text-flow h2{font-size:1.12em;color:var(--accent);font-weight:700;letter-spacing:0;text-indent:0;margin:0 0 .82em 0}
.text-flow .separator{font-size:.9em;margin:0 0 1em 0;text-indent:0;letter-spacing:.25em}
.text-flow .signature{font-size:.95em;margin:0 0 1em 0;text-indent:0}
.text-flow .aside-body{background:#fbf8f0;border-right:2px solid #b9a28b;padding-right:.3em;text-indent:0}
.text-flow .note-text{font-size:.84em;line-height:1.5;color:#5e6465;text-indent:0;font-weight:400}
.portrait-sheet{width:100%;height:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:0;min-height:0;margin:0}
.portrait-sheet img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;object-position:center;background:white}
.page-inset-note{color:var(--muted);font-size:12px;text-align:center}
.figure-sheet{gap:10px;justify-content:center}
.figure-sheet img{height:80%;max-height:80%;width:100%;max-width:100%;object-fit:contain}
.figure-sheet figcaption{font-size:13px;line-height:1.6;color:#46575b;text-align:left;margin:0;max-height:24%;overflow:auto;word-break:normal}
.toc-flow{height:100%;overflow:auto;overscroll-behavior:contain}
.toc-header{font-family:'Hiragino Mincho ProN','Yu Mincho',serif;color:var(--accent);font-size:22px;font-weight:700;margin:4px 2px 15px}
.toc-row{display:flex;gap:12px;border-bottom:1px solid #ebeae1;align-items:baseline;line-height:1.45;padding:8px 3px;font-size:14px}
.toc-row .toc-name{flex:1;min-width:0}
.toc-row .toc-number{color:#68757a;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.toc-row.level-0{font-weight:700;color:#554f48}
.toc-row.level-1{font-weight:600;padding-left:11px}
.toc-row.level-2{padding-left:24px;font-size:13px}
.loading{display:flex;align-items:center;justify-content:center;height:100%;font-size:14px;color:#64716e}
.measuring-sheet{position:fixed!important;left:-20000px!important;top:-20000px!important;visibility:hidden!important;pointer-events:none!important;max-height:none!important}
.reader-footer{flex:0 0 auto;padding:2px 12px calc(4px + env(safe-area-inset-bottom));background:#f8f9f5;border-top:1px solid #e1e5df}
.progress-line{height:2px;background:#e3e6e1;max-width:520px;margin:0 auto 5px}
#progress-fill{height:100%;width:0;background:#8c6c5d;transition:width .15s}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:520px;margin:auto}
.page-nav{min-width:72px;min-height:40px;border:1px solid #d8dfd8;background:white;border-radius:9px;padding:6px 9px;font-size:14px}
.page-nav:disabled{opacity:.35;cursor:default}
.location-indicator{text-align:center;font-size:12px;color:#5b6b6d;min-width:88px;font-variant-numeric:tabular-nums}
.location-indicator strong{display:block;font-size:13px;color:#2c3538;font-weight:650}
.location-indicator small{font-size:10px;color:#7d8583}
.menu-overlay{position:fixed;inset:0;z-index:100;background:#18232470;display:flex;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
.menu-overlay[hidden]{display:none}
.menu{background:#fafbf7;color:#223034;border-radius:18px 18px 0 0;width:min(100%,520px);padding:18px;box-shadow:0 -10px 35px #0f1c1b22}
.menu-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.menu-title strong{font-size:16px}
.menu-close{background:white;border:1px solid #dde1db;border-radius:8px;min-width:40px;min-height:40px}
.menu button.menu-item{display:block;text-align:left;background:white;border:1px solid #e4e8e4;border-radius:11px;width:100%;padding:12px 15px;margin:7px 0;font-size:15px}
.menu-detail{font-size:11px;color:#6c7976;padding:7px 0 0;line-height:1.6}
@media(min-width:700px){.reader-main{background:#e9eeea;padding:10px 0}.sheet{max-width:560px;border:1px solid #e4e6de;box-shadow:0 2px 15px #45534a12}}
@media(max-height:620px){.toolbar{padding-top:calc(2px + env(safe-area-inset-top));padding-bottom:2px}.reader-footer{padding-bottom:calc(2px + env(safe-area-inset-bottom))}.sheet{padding:6px 9px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* 図＋図題＋説明を一体化して本文から明確に区別する */
.figure-bundle{width:100%;height:100%;display:flex;flex-direction:column;gap:6px;border:1px solid #deded4;border-radius:13px;background:#fffefb;padding:9px 10px;overflow:hidden}
.figure-bundle-header{display:flex;flex-direction:column;gap:3px;flex:0 0 auto;min-height:0}
.figure-bundle-kicker{font-size:11px;line-height:1.2;color:#995644;font-weight:700;letter-spacing:.06em}
.figure-bundle-title{font-weight:700;font-size:clamp(14px,calc(var(--size)*.77),19px);line-height:1.32;color:#273034;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.figure-bundle-tabs{display:flex;flex-wrap:wrap;gap:6px;flex:0 0 auto}
.figure-bundle-tabs button{border:1px solid #d1d6ce;color:#3a5655;background:#f8faf6;border-radius:7px;font-size:12px;line-height:1.2;padding:5px 8px;min-height:28px}
.figure-bundle-tabs button[aria-pressed="true"]{color:white;background:#355e60;border-color:#355e60}
.figure-bundle-art{width:100%;height:41%;flex:0 0 41%;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;background:white;border-radius:6px}
.figure-bundle-art img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center}
.figure-bundle-figlabel{font-size:11px;line-height:1.25;text-align:center;color:#607071;flex:0 0 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.figure-bundle-explanation{border-top:1px solid #e1e5de;padding-top:7px;display:flex;flex-direction:column;gap:4px;flex:1 1 auto;min-height:0;overflow:hidden}
.figure-bundle-caption-label{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;line-height:1.25;color:#83513e;font-weight:700}
.figure-bundle-caption-content{display:block;white-space:inherit}
.figure-bundle-caption-text{font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif CJK JP',serif;font-size:clamp(15px,calc(var(--size)*.84),25px);line-height:1.48;letter-spacing:0;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap;word-break:normal;flex:1 1 auto;min-height:0;color:#263039}
.figure-bundle-no-desc .figure-bundle-art{flex:1 1 auto;height:auto}
.figure-bundle-no-desc .figure-bundle-explanation{flex:0 0 auto;min-height:0}
.figure-bundle-empty{font-size:12px;color:#687273;line-height:1.5}
.figure-bundle-image-sequence{font-size:11px;color:#7b8885;flex:0 0 auto}
@media(max-height:620px){.figure-bundle-art{height:36%;flex-basis:36%}.figure-bundle{padding:6px 8px;gap:4px}.figure-bundle-explanation{padding-top:5px;gap:2px}.figure-bundle-tabs button{padding:3px 6px;min-height:25px}}


#first{font-size:12px;min-height:40px;padding:6px 8px;white-space:nowrap}
@media(max-width:520px){
.toolbar-line{flex-wrap:wrap!important;column-gap:4px!important;row-gap:4px!important}
.toolbar-line .brand{flex:1 1 100%!important;width:100%!important;min-width:0!important}
.toolbar-line .brand strong{font-size:15px!important}
.toolbar-line .brand small{display:none!important}
.toolbar-line .head-actions{display:flex!important;width:100%!important;min-width:0!important;justify-content:space-between!important;gap:4px!important}
.toolbar-line .head-actions .nav-button{min-height:36px!important;padding:5px 6px!important;font-size:12px!important}

.toolbar-line .head-actions .size-button{min-height:34px!important;padding:3px 6px!important;font-size:16px!important}
.toolbar-line .head-actions #current-size{min-width:34px!important;font-size:11px!important}}
@media(max-width:350px){
.toolbar-line .head-actions .nav-button{padding:5px 4px!important;font-size:11px!important}
.toolbar-line .head-actions .size-button{padding:3px 5px!important}
.toolbar-line .head-actions #current-size{min-width:30px!important}}

/* Only figure pages in the audited WH1 source-scan range 11-30. */
.figure-bundle.wh1-audited-figure{box-sizing:border-box!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;writing-mode:horizontal-tb!important;direction:ltr!important;text-indent:0!important;width:100%!important;max-width:100%!important;min-width:0!important;height:100%!important;min-height:0!important;margin:0!important;padding:10px 16px!important;gap:6px!important;transform:none!important;overflow:hidden!important}
.wh1-audited-figure>*{box-sizing:border-box!important;min-width:0!important;max-width:100%!important;direction:ltr!important;writing-mode:horizontal-tb!important;margin-left:0!important;margin-right:0!important;transform:none!important}
.wh1-audited-figure .figure-bundle-header{width:100%!important;padding:0!important;flex:0 0 auto!important}
.wh1-audited-figure .figure-bundle-title{display:block!important;-webkit-line-clamp:unset!important;white-space:normal!important;overflow:visible!important;overflow-wrap:anywhere!important;text-indent:0!important}
.wh1-audited-figure .figure-bundle-art{width:100%!important;height:36%!important;flex:0 0 36%!important;min-height:0!important;padding:0!important}
.wh1-audited-figure .figure-bundle-art img{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important;object-position:center!important}
.wh1-audited-figure .figure-bundle-figlabel{flex:0 0 auto!important;white-space:normal!important;text-overflow:clip!important;overflow:visible!important;overflow-wrap:anywhere!important;line-height:1.3!important}
.wh1-audited-figure .figure-bundle-explanation{box-sizing:border-box!important;width:100%!important;flex:1 1 0%!important;min-height:0!important;margin:0!important;padding:6px 0 0!important;overflow:hidden!important;gap:4px!important}
.wh1-audited-figure .figure-bundle-caption-label{min-height:14px!important;flex:0 0 auto!important;width:100%!important;gap:5px!important}
.wh1-audited-figure .figure-bundle-image-sequence{white-space:nowrap!important}
.wh1-audited-figure .figure-bundle-caption-text{display:block!important;box-sizing:border-box!important;width:100%!important;max-width:100%!important;min-width:0!important;flex:1 1 0%!important;min-height:0!important;padding:5px 5px 8px!important;margin:0!important;overflow:hidden!important;writing-mode:horizontal-tb!important;direction:ltr!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important;word-break:normal!important;line-break:strict!important;text-indent:0!important}
.wh1-audited-figure .figure-bundle-caption-content{display:block!important;box-sizing:border-box!important;width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;padding:0!important;text-indent:0!important;transform:none!important;white-space:inherit!important;writing-mode:horizontal-tb!important;direction:ltr!important}
.wh1-audited-figure.wh1-compact .figure-bundle-art{height:24%!important;flex-basis:24%!important}
@media(max-height:560px){.figure-bundle.wh1-audited-figure{padding:6px 12px!important;gap:4px!important}.wh1-audited-figure .figure-bundle-art{height:30%!important;flex-basis:30%!important}.wh1-audited-figure.wh1-compact .figure-bundle-art{height:20%!important;flex-basis:20%!important}}
[hidden]{display:none!important}
.shelf-strip{min-height:44px;display:flex;justify-content:space-between;align-items:center;padding:3px 12px;gap:10px;background:#faf9f4;border-bottom:1px solid #d6ddd8}
.shelf-link{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:6px 12px;border:1px solid #bccbc5;border-radius:9px;background:white;color:#25474c;text-decoration:none;font:600 14px/1.2 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;white-space:nowrap}
#shelf-status{font-size:10px;color:#5c726f}
html.bookshelf-segment .shelf-strip{display:none}
.reader-main{touch-action:pan-x pinch-zoom;overscroll-behavior:contain}
body.zoomed .reader-main{touch-action:pan-x pan-y pinch-zoom;overscroll-behavior:auto}
.text-flow ruby{ruby-position:over}
.text-flow rt,.toc-name rt,.caption-flow rt{font-size:.5em;line-height:1}
.text-flow:has(ruby){overflow:visible}
.text-flow .tcy,.text-combine-upright{text-combine-upright:all}
#first{font-size:12px;min-height:40px;padding:6px 8px}
#page-major{position:relative;white-space:nowrap;min-width:14ch;font-variant-numeric:tabular-nums}
#page-major[data-global]{color:transparent}
#page-major[data-global]::after{content:attr(data-global);position:absolute;inset:0;color:var(--ink);text-align:center}
#progress-fill{width:var(--book-progress,var(--local-progress,0%))}
.toc-flow{touch-action:pan-x pinch-zoom}
body.zoomed .toc-flow{touch-action:pan-x pan-y pinch-zoom;overscroll-behavior:auto}
.toc-row{width:100%;background:transparent;color:inherit;border:0;border-bottom:1px solid #ebeae1;text-align:left;font-family:inherit}
.menu{max-height:90dvh;overflow:auto}
.original-overlay{position:fixed;inset:0;z-index:100;background:#171e20;display:flex;flex-direction:column;align-items:center}

.original-toolbar button{min-width:44px;min-height:40px;border:1px solid #829495;border-radius:8px;background:#f7faf8;color:#15343a}
.original-viewer{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.original-viewer img{display:block;width:100%;height:100%;min-height:0;object-fit:contain}
#transcript{background:#fffdf7;color:#273034;max-height:35%;overflow:auto;width:100%;padding:3px 12px}
#transcript-text{white-space:pre-wrap;font:16px/1.6 serif}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.footer-inner .location-indicator{min-width:0;max-width:calc(100% - 164px);overflow:hidden}
#page-minor{display:flex;justify-content:center;align-items:baseline;overflow:hidden;white-space:nowrap}

#wh3-status{font-size:10px;font-weight:500;letter-spacing:0;margin-left:8px;vertical-align:middle;color:#5c726f}

.figure-bundle.wh1-audited-figure[hidden]{display:none!important}
/* A vertical-text clipping layer must never cover horizontal picture pages. */
html.wh3-picture,html.wh3-picture body,
html.wh3-picture #reader-main,html.wh3-picture #sheet,
html.wh3-picture #figure-page{
 clip:auto!important;clip-path:none!important;-webkit-clip-path:none!important;
 mask-image:none!important;-webkit-mask-image:none!important;
 text-indent:0!important;writing-mode:horizontal-tb!important;direction:ltr!important;
}
html.wh3-picture #figure-page{
 box-sizing:border-box!important;position:relative!important;left:0!important;right:auto!important;
 top:0!important;width:100%!important;max-width:100%!important;min-width:0!important;
 height:100%!important;margin:0!important;padding:0!important;
 transform:translateZ(0)!important;isolation:isolate!important;
}
html.wh3-picture #sheet::before,html.wh3-picture #sheet::after,
html.wh3-picture #figure-page::before,html.wh3-picture #figure-page::after,
html.wh3-picture #reader-main::before,html.wh3-picture #reader-main::after{
 content:none!important;display:none!important;
}
.figure-bundle[data-wh1-viewport="8"]{
 box-sizing:border-box!important;min-width:0!important;width:100%!important;max-width:100%!important;
 margin-left:0!important;margin-right:0!important;text-indent:0!important;
 clip:auto!important;clip-path:none!important;-webkit-clip-path:none!important;
 mask-image:none!important;-webkit-mask-image:none!important;
 writing-mode:horizontal-tb!important;direction:ltr!important;transform:translateZ(0)!important;
}
/* Caption updates must not repaint the artwork on the same card. */
#figure-stage .figure-bundle-art{
 contain:paint;isolation:isolate;transform:translateZ(0)!important;
}
#figure-stage .figure-bundle-art img[hidden]{display:none!important}
.figure-bundle[data-wh1-viewport="8"] .figure-bundle-header,
.figure-bundle[data-wh1-viewport="8"] .figure-bundle-explanation,

.figure-bundle[data-wh1-viewport="8"] .figure-bundle-caption-content{
 min-width:0!important;max-width:100%!important;text-indent:0!important;
 clip:auto!important;clip-path:none!important;-webkit-clip-path:none!important;
 mask-image:none!important;-webkit-mask-image:none!important;
 writing-mode:horizontal-tb!important;direction:ltr!important;
}

#page-description{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#page-origin{flex:none;white-space:pre}
