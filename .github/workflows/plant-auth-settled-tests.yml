name: Plant auth prompt checks
on:
  push:
    branches: [main, fix/plant-auth-prompt-settled]
    paths:
      - 'plants/source-auth-ui.js'
      - 'tools/settle-plant-auth-ui.py'
      - 'tests/*plant-auth-settled*'
      - '.github/workflows/plant-auth-settled-tests.yml'
permissions:
  contents: read
jobs:
  plant-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build current applications
        run: |
          python3 tools/build-word-network.py
          python3 tools/build-plant-color-network.py
          python3 tools/build-storage-free-view.py
          python3 tools/restore-color-palette.py
          python3 tools/build-local-photo-view.py
          python3 tools/protect-local-names.py
          python3 tools/align-plant-order.py
          python3 tools/build-quiet-word-sync.py
          python3 tools/build-quiet-study-sync.py
          python3 tools/repair-photo-resume.py
          python3 tools/build-auth-only-ui.py
          python3 tools/repair-plant-source.py
          python3 tools/unblock-plant-transfers.py
      - name: Reproduce unnecessary old-source login after successful sync
        run: EXPECT_STALE=1 node tests/browser-plant-auth-settled.cjs
      - name: Correct only the old-source login display
        run: |
          python3 tools/settle-plant-auth-ui.py
          node --check plants/source-auth-ui.js
          node --check plants/drive-sync.js
          node --check plants/service-worker.js
          node --test tests/plant-auth-settled.test.cjs tests/service-worker.test.cjs
      - name: Verify silence after sync and genuine Google reconnect
        run: node tests/browser-plant-auth-settled.cjs
