name: Mobile photo reconnect checks
on:
  push:
    branches: [main, fix/mobile-photo-reconnect]
    paths:
      - 'plants/drive-sync.js'
      - 'study-quiet-sync.js'
      - 'tools/repair-photo-resume.py'
      - 'tools/align-plant-order.py'
      - 'tools/repair-plant-source.py'
      - 'tools/unblock-plant-transfers.py'
      - 'tools/settle-plant-auth-ui.py'
      - 'tests/plant-transfer-queue.test.cjs'
      - 'tests/photo-resume.test.cjs'
      - 'tests/browser-photo-reconnect.cjs'
      - '.github/workflows/photo-reconnect-tests.yml'
permissions:
  contents: read
jobs:
  reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build published applications
        run: |
          python3 tools/build-word-network.py
          python3 tools/build-plant-color-network.py
          python3 tools/build-storage-free-view.py
          python3 tools/restore-color-palette.py
          python3 tools/build-local-photo-view.py
          python3 tools/protect-local-names.py
          python3 tools/align-plant-order.py
          python3 tools/build-quiet-word-sync.py
          python3 tools/build-quiet-study-sync.py
          python3 tools/build-auth-only-ui.py
          python3 tools/repair-plant-source.py
          python3 tools/unblock-plant-transfers.py
          python3 tools/settle-plant-auth-ui.py
          node --test tests/plant-transfer-queue.test.cjs tests/plant-auth-settled.test.cjs
      - name: Apply image-resume repair when present
        run: |
          if [ -f tools/repair-photo-resume.py ]; then python3 tools/repair-photo-resume.py; fi
          if [ -f tests/photo-resume.test.cjs ]; then node --test tests/photo-resume.test.cjs; fi
      - name: Failed photo followed by unchanged sync and automatic new-card receive
        timeout-minutes: 2
        run: node tests/browser-photo-reconnect.cjs
      - name: Ordinary automatic receiving and saved browsing still work
        run: node tests/browser-study-quiet-sync.cjs
