name: Book creation - private preview preflight
on:
  pull_request:
    paths:
      - 'reader/preview/**'
      - 'reader/quality/registry.json'
      - 'reader/quality/reports/**'
      - 'reader/quality/receipts/**'
      - 'tools/reader-book-preflight.cjs'
      - 'tools/reader-handoff-check.cjs'
      - 'tools/reader-unified-handoff.cjs'
      - 'tools/reader-repair-plan.cjs'
      - 'tools/reader-fast-layout.py'
      - 'tests/test_reader_fast_layout.py'
      - 'reader/quality/FAST_LAYOUT_QA.md'
      - 'tools/reader-repair-profiles.cjs'
      - 'tools/reader-repair-state.cjs'
      - 'tools/reader-repair-transition.cjs'
      - 'tools/reader-repair-finalize.cjs'
      - 'tests/reader-repair-finalize.test.cjs'
      - 'tests/reader-repair-multibook.test.cjs'
      - 'tests/reader-repair-state.test.cjs'
      - 'reader/quality/REPAIR_PROFILES_AND_STATES.md'
      - 'tests/reader-repair-plan.test.cjs'
      - 'tools/reader-work-ledger-validate.cjs'
      - 'reader/quality/work-ledger.json'
      - 'tests/reader-unified-handoff.test.cjs'
      - 'tests/reader-work-ledger-validate.test.cjs'
      - 'tools/reader-source-preflight.py'
      - 'tools/reader-private-pipeline.cjs'
      - 'tests/test_reader_source_preflight.py'
      - 'tests/reader-source-pipeline-gate.test.cjs'
      - 'tests/reader-handoff-check.test.cjs'
      - 'tests/reader-nine-stories-safe-loader-v2.test.cjs'
      - 'tests/browser-nine-stories-safe-loader-v2.cjs'
      - 'tests/browser-nine-stories-041-060-safe-loader-v2.cjs'
      - 'tests/browser-nine-stories-041-060-safe-loader-v3.cjs'
      - 'tests/reader-book-preflight.test.cjs'
      - 'tools/reader-evidence-gate.cjs'
      - 'tools/reader-verify-pages.cjs'
      - 'tests/reader-evidence-gate.test.cjs'
      - 'tests/reader-verify-pages.test.cjs'
      - 'reader/quality/BOOK_CREATION_PROCESS.md'
      - 'reader/quality/RELEASE_PROCESS.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'reader/preview/**'
      - 'reader/quality/registry.json'
      - 'reader/quality/reports/**'
      - 'reader/quality/receipts/**'
      - 'tools/reader-book-preflight.cjs'
      - 'tools/reader-handoff-check.cjs'
      - 'tools/reader-unified-handoff.cjs'
      - 'tools/reader-repair-plan.cjs'
      - 'tools/reader-fast-layout.py'
      - 'tests/test_reader_fast_layout.py'
      - 'reader/quality/FAST_LAYOUT_QA.md'
      - 'tools/reader-repair-profiles.cjs'
      - 'tools/reader-repair-state.cjs'
      - 'tools/reader-repair-transition.cjs'
      - 'tools/reader-repair-finalize.cjs'
      - 'tests/reader-repair-finalize.test.cjs'
      - 'tests/reader-repair-multibook.test.cjs'
      - 'tests/reader-repair-state.test.cjs'
      - 'reader/quality/REPAIR_PROFILES_AND_STATES.md'
      - 'tests/reader-repair-plan.test.cjs'
      - 'tools/reader-work-ledger-validate.cjs'
      - 'reader/quality/work-ledger.json'
      - 'tests/reader-unified-handoff.test.cjs'
      - 'tests/reader-work-ledger-validate.test.cjs'
      - 'tools/reader-source-preflight.py'
      - 'tools/reader-private-pipeline.cjs'
      - 'tests/test_reader_source_preflight.py'
      - 'tests/reader-source-pipeline-gate.test.cjs'
      - 'tests/reader-handoff-check.test.cjs'
      - 'tests/reader-nine-stories-safe-loader-v2.test.cjs'
      - 'tests/browser-nine-stories-safe-loader-v2.cjs'
      - 'tests/browser-nine-stories-041-060-safe-loader-v2.cjs'
      - 'tests/browser-nine-stories-041-060-safe-loader-v3.cjs'
      - 'tests/reader-book-preflight.test.cjs'
      - 'tools/reader-evidence-gate.cjs'
      - 'tools/reader-verify-pages.cjs'
      - 'tests/reader-evidence-gate.test.cjs'
      - 'tests/reader-verify-pages.test.cjs'
      - 'reader/quality/BOOK_CREATION_PROCESS.md'
      - 'reader/quality/RELEASE_PROCESS.md'
      - 'AGENTS.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate book creation checks and rejection fixtures
        run: |
          node --check tools/reader-book-preflight.cjs
          node --check tools/reader-handoff-check.cjs
          node --check tools/reader-unified-handoff.cjs
          node --check tools/reader-repair-plan.cjs
          node --check tools/reader-repair-profiles.cjs
          node --check tools/reader-repair-state.cjs
          node --check tools/reader-repair-transition.cjs
          node --check tools/reader-repair-finalize.cjs
          node --test tests/reader-repair-plan.test.cjs tests/reader-repair-multibook.test.cjs tests/reader-repair-state.test.cjs tests/reader-repair-finalize.test.cjs
          node --check tools/reader-work-ledger-validate.cjs
          node --test tests/reader-unified-handoff.test.cjs tests/reader-work-ledger-validate.test.cjs
          node tools/reader-work-ledger-validate.cjs
          node --check tools/reader-private-pipeline.cjs
          node --test tests/reader-source-pipeline-gate.test.cjs
          node --test tests/reader-book-preflight.test.cjs tests/reader-evidence-gate.test.cjs tests/reader-verify-pages.test.cjs tests/reader-handoff-check.test.cjs tests/reader-nine-stories-safe-loader-v2.test.cjs
          node --check tools/reader-evidence-gate.cjs
          node --check tools/reader-verify-pages.cjs
      - name: Verify fast SHA-pinned layout QA matrix and cache invalidation
        run: |
          python3 -m py_compile tools/reader-fast-layout.py
          python3 -m unittest discover -s tests -p 'test_reader_fast_layout.py' -v
      - name: Verify source folder-vs-search and ZIP-byte synthetic regression
        run: |
          python3 -m unittest discover -s tests -p 'test_reader_source_preflight.py' -v
      - name: Exercise new pinned importer in Chromium with synthetic 20-page sample
        run: |
          node --check tests/browser-nine-stories-safe-loader-v2.cjs
          node tests/browser-nine-stories-safe-loader-v2.cjs
          node --check tests/browser-nine-stories-041-060-safe-loader-v2.cjs
          node tests/browser-nine-stories-041-060-safe-loader-v2.cjs
          node --check tests/browser-nine-stories-041-060-safe-loader-v3.cjs
          node tests/browser-nine-stories-041-060-safe-loader-v3.cjs
      - name: Validate every registered preview before new-book publication
        run: node tools/reader-book-preflight.cjs --all
      - name: Record verification boundary
        run: echo 'PUBLIC-LOADER PREFLIGHT ONLY. This does not mark 60 OCR checks passed or a real iPhone verified.'
