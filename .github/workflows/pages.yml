name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-v6"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enforce shared reader ledger and unified handoff regressions
        run: |
          node --check tools/reader-unified-handoff.cjs
          node --check tools/reader-preview-consent.cjs
          node --check tools/reader-scoped-review.cjs
          node --check tools/reader-work-ledger-validate.cjs
          node --test tests/reader-proof-batches.test.cjs tests/reader-ruby-coverage.test.cjs tests/reader-unified-handoff.test.cjs tests/reader-work-ledger-validate.test.cjs tests/reader-preview-consent.test.cjs tests/reader-preview-v3.test.cjs tests/reader-repair-context.test.cjs tests/reader-work-resume.test.cjs
          node --check tools/reader-repair-profiles.cjs
          node --check tools/reader-repair-state.cjs
          node --check tools/reader-repair-transition.cjs
          node --check tools/reader-repair-finalize.cjs
          node --test tests/reader-repair-plan.test.cjs tests/reader-repair-multibook.test.cjs tests/reader-repair-state.test.cjs tests/reader-repair-finalize.test.cjs
          python3 -m unittest discover -s tests -p 'test_reader_fast_layout.py' -v
          node tools/reader-work-ledger-validate.cjs
      - name: Check word recovery before publication
        run: |
          node --check word-sync-check/safety.js
          node --test tests/word-sync-safety.test.cjs
          node --check drive-core.js
          node --check persistent-drive-auth.js
          node --test tests/drive-core.test.cjs tests/drive-auth-integration.test.cjs server/drive-auth/client.test.mjs
          node --check word-images.js
          node --check word-images-ui.js
          node --test tests/word-images.test.cjs tests/word-image-integration.test.cjs tests/word-image-paste.test.cjs tests/word-image-pinch.test.cjs
          node --check drive-sync.js
          node --check word-network-recovery.js
          node --test tests/word-network*.test.cjs
          node --test tests/plant-drive-image-copy.test.cjs
          node --test tests/service-worker.test.cjs
          node --test tests/plant-reconnect-status.test.cjs
      - name: Generate versioned word app entries
        run: python3 tools/build-word-network.py
      - name: Build and check plant and color network entries
        run: |
          python3 tools/build-plant-color-network.py
          node --check plants/drive-sync.js
          node --check plants/network-support.js
          node --check colors/app-main.js
          node --check colors/drive-sync.js
          node --check colors/network-support.js
          node --check colors/data/review47-loader.js
          node --check colors/nav-top.js
          node --test tests/color-card-top-scroll.test.cjs
          node --test tests/plant-color-network.test.cjs
          git diff --exit-code -- drive-core.js drive-sync.js word-network-recovery.js colors/data/review47-progress.b64 colors/private-assets-manifest.json
      - name: Build and check isolated storage-free viewers
        run: |
          sha256sum drive-core.js drive-sync.js index.html plants/index.html plants/drive-sync.js colors/index.html colors/app-main.js colors/drive-sync.js colors/origin-editor.js colors/data/review47-progress.b64 colors/private-assets-manifest.json > /tmp/before-view-build.sha
          python3 tools/build-storage-free-view.py
          sha256sum --check /tmp/before-view-build.sha
          node --check drive-readonly.js
          node --check readonly-guard.js
          node --check plants/readonly-adapter.js
          node --check colors/readonly-adapter.js
          node --test tests/storage-free-view.test.cjs
      - name: Restore and check palette photograph rows
        run: |
          python3 tools/restore-color-palette.py
          node --check colors/app-main.js
          node --check colors/app-view.js
          node --check colors/data/review47-loader.js
          node --check colors/data/review47-view-loader.js
          node --check colors/service-worker.js
          node --test tests/color-palette-restoration.test.cjs
      - name: Build and test local-first photo viewers
        run: |
          python3 tools/build-local-photo-view.py
          node --check drive-view-cache.js
          node --check drive-local-view.js
          node --check drive-local-base.js
          node --check view-shell.js
          node --check plants/local-adapter.js
          node --check colors/local-adapter.js
          node --check plants/drive-view-worker.js
          node --check colors/drive-view-worker.js
          node --check colors/data/review47-local-loader.js
          node --test tests/local-photo-view.test.cjs
      - name: Preserve names and verify browser restart behavior
        run: |
          python3 tools/protect-local-names.py
          node --check drive-legacy-view.js
          node --test tests/name-retention.test.cjs
      - name: Align plant order with the PC and verify saved browsing
        run: |
          python3 tools/align-plant-order.py
          node --check plants/normal-order.js
          node --check plants/pc-order-source.js
          node --check plants/drive-sync.js
          node --check plants/local-adapter.js
          node --test tests/plant-normal-order.test.cjs
      - name: Keep word synchronization outside the reading layout
        run: |
          python3 tools/build-quiet-word-sync.py
          node --check word-quiet-sync.js
          node --check word-recovery.js
          node --check service-worker.js
          node --test tests/word-quiet-sync.test.cjs tests/service-worker.test.cjs
      - name: Quiet automatic plant and color synchronization
        run: |
          python3 tools/build-quiet-study-sync.py
          node --check study-quiet-sync.js
          node --check plants/drive-sync.js
          node --check plants/local-adapter.js
          node --check colors/drive-sync.js
          node --check colors/local-adapter.js
          node --check colors/origin-editor.js
          node --check colors/origin-editor-view.js
          node --check colors/data/review47-local-loader-v2.js
          node --check plants/drive-view-worker.js
          node --test tests/study-quiet-sync.test.cjs tests/service-worker.test.cjs
      - name: Retry failed mobile pictures without rebuilding cards
        run: |
          python3 tools/repair-photo-resume.py
          node --check plants/photo-resume.js
          node --check plants/local-adapter.js
          node --check colors/local-adapter.js
          node --check photo-view-shell.js
          node --check plants/drive-view-worker.js
          node --test tests/photo-resume.test.cjs
      - name: Display only required authentication controls
        run: |
          python3 tools/build-auth-only-ui.py
          node --check auth-only-ui.js
          node --check word-quiet-sync.js
          node --check study-quiet-sync.js
          node --test tests/auth-only-ui.test.cjs tests/service-worker.test.cjs
      - name: Recover missing plant photo source assignments
        run: |
          python3 tools/repair-plant-source.py
          node --check plants/legacy-photo-source.js
          node --check plants/drive-sync.js
          node --check plants/service-worker.js
          node --test tests/plant-source-repair.test.cjs tests/service-worker.test.cjs
      - name: Keep unavailable photos from blocking new registrations
        run: |
          python3 tools/unblock-plant-transfers.py
          node --check plants/drive-transfer-core.js
          node --check plants/drive-sync.js
          node --check plants/legacy-photo-source.js
          node --test tests/plant-transfer-queue.test.cjs tests/service-worker.test.cjs
      - name: Hide obsolete old-source auth after successful photo sync
        run: |
          python3 tools/settle-plant-auth-ui.py
          node --check plants/source-auth-ui.js
          node --check plants/drive-sync.js
          node --check plants/service-worker.js
          node --test tests/plant-auth-settled.test.cjs tests/service-worker.test.cjs
          node --test tests/plant-photo-retry.test.cjs
          node --test tests/plant-photo-auto-sync.test.cjs
      - name: Automatically publish newly registered color-card photos
        run: |
          python3 tools/build-color-photo-autosync.py
          node --check colors/drive-sync.js
          node --check colors/drive-transfer-core.js
          node --check colors/network-support.js
          node --test tests/color-photo-auto-sync.test.cjs
          node --test tests/service-worker.test.cjs
      - name: Show plant descriptions above photographs
        run: |
          python3 tools/plant-description-first.py
          node --test tests/service-worker.test.cjs
          node --test tests/plant-pinch.test.cjs
      - name: Keep plant photo copying internal and accessible on request
        run: |
          node --check plants/drive-sync.js
          node --test tests/plant-quiet-photo-diagnostics.test.cjs
          node tests/browser-plant-quiet-photo-diagnostics.cjs
      - name: Build and validate categorized firearm cards
        run: |
          python3 tools/build-gun-flashcards.py
          node --check guns/extended-models.js
          node --check guns/extended-variants.js
          node --check guns/data.js
          node --check guns/app.js
          node --check guns/drive-sync.js
          node --check guns/image-copy.js
          node --check guns/drive-transfer-core.js
          node --check guns/service-worker.js
          node --test tests/gun-flashcards.test.cjs
          node --test tests/gun-photo-sync.test.cjs tests/gun-photo-republish.test.cjs
          node --test tests/gun-sync-io.test.cjs tests/gun-sync-stall.test.cjs
          node --test tests/gun-catalog-2000.test.cjs
          node tests/browser-guns.cjs
      - name: Publish fresh color photo sharing viewer
        run: |
          python3 tools/build-color-photo-share-entry.py
          node --test tests/color-photo-share-entry.test.cjs
      - name: Build WH1 figure display v9 without changing private books
        run: |
          python3 tools/build-wh1-figure-viewport-v8.py
          python3 tools/build-wh1-library-v9.py
          node --check reader/wh1/all/wh1-figure-viewport-v9.js
          node --check reader/wh1/all/wh1-display-check-v9.js
          node --check reader/library/wh1-reader-routing.js
          node --check reader/library/sw.js
          node --check reader/wh1/all/sw.js
          node --test tests/wh1-figure-viewport-v8.test.cjs tests/wh1-display-check-v9.test.cjs tests/wh1-library-routing.test.cjs tests/wh1-library-build.test.cjs tests/reader-shelf-caption-ruby.test.cjs tests/reader-shelf-bound-headings.test.cjs
          node --test tests/uk82-first-page-button.test.cjs tests/reader-first-page-ui-release.test.cjs tests/reader-bookshelf-nav-ui.test.cjs tests/uk82-paragraph-flow.test.cjs tests/reader-standard-templates.test.cjs
          node --test tests/reader-novel-template.test.cjs tests/reader-g404-pagination.test.cjs
      - name: Test verified reader link issuer, including all blocked cases
        run: |
          node --check tools/reader-issue-verified-links.cjs
          node --test tests/reader-issue-verified-links.test.cjs
      - name: Check existing book registrations before staging common QA code
        run: node tools/reader-book-preflight.cjs --all
      - name: Prepare evidence-admitted reader deployment without touching source
        run: node tools/reader-publish-stage.cjs . "$RUNNER_TEMP/reader-pages"
      - name: Validate generic layout QA in the exact staged tree
        env:
          READER_AUDIT_ROOT: ${{ runner.temp }}/reader-pages
        run: |
          node --check tools/verify-layout-qa-pages.cjs
          node --test tests/reader-layout-qa.test.cjs tests/reader-layout-qa-pages.test.cjs
      - name: Validate the exact final deployment tree
        env:
          READER_AUDIT_ROOT: ${{ runner.temp }}/reader-pages
        run: |
          node --test tests/reader-release-control.test.cjs tests/reader-quality-gate.test.cjs tests/reader-artifact-audit.test.cjs tests/world-symbols-repair.test.cjs tests/world-symbols-gesture-v5.test.cjs tests/world-symbols-layout-v6.test.cjs tests/world-symbols-initials-v7.test.cjs
          node tools/reader-release-control.cjs repo "$READER_AUDIT_ROOT"
          node --test tests/reader-evidence-gate.test.cjs tests/reader-verify-pages.test.cjs
      - name: Verify cross-volume reading for newly packaged books
        working-directory: ${{ runner.temp }}/reader-pages
        run: |
          node --test tests/reader-continuous-sections.test.cjs tests/reader-new-book-flow.test.cjs tests/reader-shelf-*.test.cjs tests/reader-single-document-paint.test.cjs
          python3 -m venv "$RUNNER_TEMP/shelf-qa"
          qa_python="$RUNNER_TEMP/shelf-qa/bin/python"
          "$qa_python" -m pip install --disable-pip-version-check Pillow playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            "$qa_python" -m playwright install chromium
          fi
          "$qa_python" "$GITHUB_WORKSPACE/tests/test_word_back_scroll_browser.py"
          "$qa_python" "$GITHUB_WORKSPACE/tests/test_word_image_pinch_browser.py"
          "$qa_python" "$GITHUB_WORKSPACE/tests/test_word_sync_check_browser.py"
          "$qa_python" "$GITHUB_WORKSPACE/tests/test_plant_pinch_browser.py"
          "$qa_python" -m unittest discover -v -s tests -p 'test_reader_template_readback.py'
          timeout --signal=ABRT --kill-after=10s 8m "$qa_python" -u -X faulthandler -m unittest discover -v --durations 10 -s tests -p 'test_reader_shelf*.py'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/reader-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout the exact deployed source for public URL evidence
        uses: actions/checkout@v4
      - name: Verify published word image editor and native paste field
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          from pathlib import Path
          from os import environ
          # Verify the actual deployed entries, not just the repository source.
          expected = [
              'data-word-image-footer="outside-v1"',
              'word-images-ui.js?v=20261126-normalview2',
              'back.append(bl,backContent);card.append(front,back);wordImageAction.replaceChildren(imageEntry);',
              'function resetWordBackScroll(card){',
              'function flipWordCardFace(card){',
              'function returnWordPageToNormalView(){',
              'normalViewZoomResetPending',
              'maximum-scale=1',
              'card.addEventListener("touchend",e=>{',
              '.word-page-zoomed .card,.word-page-zoomed .back-content{touch-action:auto}',
              'word-back-scroll-build" content="20261126-top2',
              'word-page-zoom-build" content="20261126-normalview2',
              'word-front-height-build" content="20261126-frontmatch1',
              'word-meaning-photo-gap-build" content="20261128-meaning-gap4',
              'word-description-order-build" content="20261128-images-first1',
              'word-photo-photo-gap-build" content="20261128-photo-gap3',
              'drive-core.js?v=20261128-word-sync4',
              'drive-sync.js?v=20261128-word-sync4',
              'persistent-drive-auth.js?v=20261128-word-sync4',
              'word-images.css?v=20261128-photo-gap3',
              'word-card-number-build" content="20261126-number-right1',
              'word-text-number-build" content="20261126-textnum-top1',
              'word-image-number-build" content="20261126-imagenum-near1',
              'word-front-number-build" content="20261126-frontnum-near1',
              '.card-number-front{position:absolute;right:24px;top:64px;z-index:4}',
              '.card-number-front{right:18px;top:58px}',
              '.card.with-images.show-back:not(.is-editing) .back{padding-top:66px}',
              '@media(max-width:560px){.card.with-images.show-back:not(.is-editing) .back{padding-top:60px}}',
              '.card:not(.with-images):not(.is-editing) .back-content{height:100%;display:flex;flex-direction:column}',
              '.card:not(.with-images):not(.is-editing) .back-content > .card-text{margin-top:auto;margin-bottom:auto;flex:0 0 auto}',
              'backContent.append(backNumber,imageArea,bt)',
              '.card-number-back{position:static;display:block;width:max-content;max-width:100%;margin:0 0 12px auto;text-align:right;flex:none}',
              '.card.with-images.show-back:not(.is-editing) .back-content > .card-text:not(:empty){margin-top:4lh}',
              '.card.with-images.show-back,.card.is-editing{height:clamp(360px,calc(100dvh - 250px),660px)}',
              '.card.with-images.show-back,.card.is-editing{height:clamp(340px,calc(100dvh - 245px),600px)}',
              '.back{display:flex;visibility:hidden;pointer-events:none;',
              '.card:not(.show-back) .back-content{overflow-y:hidden}',
              'imageEntry.onclick=e=>{e.stopPropagation();if(editing||!card.isConnected||stage.inert)return;startEdit(true)};',
          ]
          for path in ('', 'word-sync-v2.html', 'word-images-ui.js', 'word-images.css'):
              url = 'https://pirokiiiiito-arch.github.io/flashcards/' + path + '?release=' + environ['GITHUB_SHA']
              for attempt in range(10):
                  try:
                      req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=15) as res:
                          html = res.read().decode('utf-8')
                          if path == 'word-images-ui.js':
                              markers = ["pasteZone.contentEditable = 'true'", 'function consumeNativeInsertion()', 'function pastedImages(event)', 'function readImageSources(sources)', "attributeFilter: ['src']", 'Chrome on iPhone can expose an image item', 'readRemoteImage(src)', 'クリップボードから画像データを取得できませんでした。', 'normalizeClipboardFile(file)', 'reportUnreadable(reason)', 'recordClipboardItems(items)', '写真・ファイルから追加', "const PASTE_VERSION = 'paste8'", 'apiAvailability', 'const isIOSChrome', 'clearPasteDiagnostic()', 'open.append(picture);']
                          elif path == 'word-images.css':
                              markers = ['.word-image-open{', '.word-image-picture{', 'touch-action:pan-y pinch-zoom', '.word-image-open[hidden]{display:none!important}', '.word-page-zoomed .word-image-open,.word-page-zoomed .word-image-picture{touch-action:auto}', '.card.with-images.show-back:not(.is-editing) .back .word-image-gallery{font-size:var(--word-meaning-font-size);line-height:var(--word-meaning-line-height);row-gap:3lh}']
                          else:
                              markers = expected
                          forbidden = ['function enablePinchZoom(', 'ピンチで拡大・縮小', 'タップで拡大']
                          if res.status == 200 and all(marker in html for marker in markers) and all(word not in html for word in forbidden) and 'startEdit();imageEditor?.choose()' not in html:
                              print('PASS published word footer:', url)
                              break
                  except Exception as exc:
                      print(type(exc).__name__, str(exc))
                  time.sleep(4)
              else:
                  raise SystemExit('Published word footer not verified: ' + url)
          PY
      - name: Verify the public generic layout QA program exact deployed bytes
        run: node tools/verify-layout-qa-pages.cjs "$RUNNER_TEMP/reader-layout-qa-public-evidence.json"
      - name: Preserve generic layout QA publication evidence even on verification failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-layout-qa-public-evidence
          path: ${{ runner.temp }}/reader-layout-qa-public-evidence.json
          if-no-files-found: warn
      - name: Verify admitted reading URLs return HTTP 200 and exact SHA-256 bytes
        run: node tools/reader-verify-pages.cjs . "$RUNNER_TEMP/reader-public-delivery-evidence.json"
      - name: Issue verified reader links only from fresh same-run public GET evidence
        run: node tools/reader-issue-verified-links.cjs . "$RUNNER_TEMP/reader-public-delivery-evidence.json" "$RUNNER_TEMP/reader-verified-links.json"
      - name: Preserve approved reader links only after issuer success
        uses: actions/upload-artifact@v4
        with:
          name: reader-verified-links
          path: |
            ${{ runner.temp }}/reader-verified-links.json
            ${{ runner.temp }}/reader-verified-links.txt
          if-no-files-found: error
      - name: Verify public novel-demo and WH1 standard runtime exact deployed bytes
        run: node tools/verify-novel-template-pages.cjs "$RUNNER_TEMP/novel-demo-public-evidence.json"
      - name: Preserve novel-demo publication evidence even on verification failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-template-public-evidence
          path: ${{ runner.temp }}/novel-demo-public-evidence.json
          if-no-files-found: warn
      - name: Preserve public delivery evidence even on verification failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-public-delivery-evidence
          path: ${{ runner.temp }}/reader-public-delivery-evidence.json
          if-no-files-found: warn

