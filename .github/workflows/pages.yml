name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-v4"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check word recovery before publication
        run: |
          node --check drive-sync.js
          node --check word-network-recovery.js
          node --test tests/word-network*.test.cjs
          node --test tests/plant-drive-image-copy.test.cjs
          node --test tests/service-worker.test.cjs
      - name: Generate versioned word app entries
        run: python3 tools/build-word-network.py
      - name: Build and check plant and color network entries
        run: |
          python3 tools/build-plant-color-network.py
          node --check plants/drive-sync.js
          node --check plants/network-support.js
          node --check colors/app-main.js
          node --check colors/drive-sync.js
          node --check colors/network-support.js
          node --check colors/data/review47-loader.js
          node --test tests/plant-color-network.test.cjs
          git diff --exit-code -- drive-core.js drive-sync.js word-network-recovery.js colors/data/review47-progress.b64 colors/private-assets-manifest.json
      - name: Build and check isolated storage-free viewers
        run: |
          sha256sum drive-core.js drive-sync.js index.html plants/index.html plants/drive-sync.js colors/index.html colors/app-main.js colors/drive-sync.js colors/origin-editor.js colors/data/review47-progress.b64 colors/private-assets-manifest.json > /tmp/before-view-build.sha
          python3 tools/build-storage-free-view.py
          sha256sum --check /tmp/before-view-build.sha
          node --check drive-readonly.js
          node --check readonly-guard.js
          node --check plants/readonly-adapter.js
          node --check colors/readonly-adapter.js
          node --test tests/storage-free-view.test.cjs
      - name: Restore and check palette photograph rows
        run: |
          python3 tools/restore-color-palette.py
          node --check colors/app-main.js
          node --check colors/app-view.js
          node --check colors/data/review47-loader.js
          node --check colors/data/review47-view-loader.js
          node --check colors/service-worker.js
          node --test tests/color-palette-restoration.test.cjs
      - name: Build and test local-first photo viewers
        run: |
          python3 tools/build-local-photo-view.py
          node --check drive-view-cache.js
          node --check drive-local-view.js
          node --check drive-local-base.js
          node --check view-shell.js
          node --check plants/local-adapter.js
          node --check colors/local-adapter.js
          node --check plants/drive-view-worker.js
          node --check colors/drive-view-worker.js
          node --check colors/data/review47-local-loader.js
          node --test tests/local-photo-view.test.cjs
      - name: Preserve names and verify browser restart behavior
        run: |
          python3 tools/protect-local-names.py
          node --check drive-legacy-view.js
          node --test tests/name-retention.test.cjs
          node tests/browser-name-retention.cjs
      - name: Align plant order with the PC and verify saved browsing
        run: |
          python3 tools/align-plant-order.py
          node --check plants/normal-order.js
          node --check plants/pc-order-source.js
          node --check plants/drive-sync.js
          node --check plants/local-adapter.js
          node --test tests/plant-normal-order.test.cjs
          node tests/browser-plant-order.cjs
      - name: Keep word synchronization outside the reading layout
        run: |
          python3 tools/build-quiet-word-sync.py
          node --check word-quiet-sync.js
          node --check drive-sync.js
          node --check word-recovery.js
          node --check service-worker.js
          node --test tests/word-quiet-sync.test.cjs tests/service-worker.test.cjs
          node tests/browser-word-quiet-sync.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
