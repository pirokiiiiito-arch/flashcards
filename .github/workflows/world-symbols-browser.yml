name: World Symbols reader mobile regression
on:
  push:
    branches: [main]
    paths:
      - 'reader/world-symbols/**'
      - 'tests/world-symbols-repair.test.cjs'
      - 'tests/browser-world-symbols-reader.cjs'
      - 'tests/fixtures/world-symbols-synthetic.html'
      - '.github/workflows/world-symbols-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and source integrity
        run: |
          node tools/reader-quality-gate.cjs
          node --test tests/world-symbols-repair.test.cjs tests/world-symbols-gesture-v5.test.cjs
      - name: Install Chromium and WebKit
        run: |
          npm install --prefix /tmp/world-symbols-playwright --no-package-lock playwright@1.56.1
          /tmp/world-symbols-playwright/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Match WH1 mobile gestures, persistent illustrations and 24 layouts
        env:
          NODE_PATH: /tmp/world-symbols-playwright/node_modules
        run: node tests/browser-world-symbols-reader.cjs
