name: WH1 reader template v2 regression
on:
  pull_request:
    paths:
      - 'templates/reader/v2/**'
      - 'tests/reader-template-v2.test.cjs'
      - 'tests/reader-novel-template.test.cjs'
      - 'tools/verify-novel-template-pages.cjs'
      - '.github/workflows/reader-template-v2.yml'
  push:
    branches: [main]
    paths:
      - 'templates/reader/v2/**'
      - 'tests/reader-template-v2.test.cjs'
      - 'tests/reader-novel-template.test.cjs'
      - 'tools/verify-novel-template-pages.cjs'
      - '.github/workflows/reader-template-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated template source without private book assets
        run: |
          node --check templates/reader/v2/standard.js
          node --check templates/reader/v2/novel-dialogue.js
          node --check templates/reader/v2/novel.js
          node --check tools/verify-novel-template-pages.cjs
          node --test tests/reader-template-v2.test.cjs tests/reader-novel-template.test.cjs
      - name: Package exact public v2 template bytes for browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wh1-reader-template-v2-${{ github.sha }}
          path: templates/reader/v2/
          retention-days: 3
