name: WH1 figure viewport v9 regression
on:
  push:
    branches: [main, 'fix/wh1-figure-viewport-v9*']
    paths:
      - 'reader/wh1/all/**'
      - 'reader/library/**'
      - 'tools/build-wh1-figure-viewport-v8.py'
      - 'tools/build-wh1-library-v9.py'
      - 'tests/*wh1-figure-viewport-v8*'
      - 'tests/*wh1-library*'
      - 'tests/wh1-display-check-v9.test.cjs'
      - '.github/workflows/wh1-figure-viewport-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check versioned reader entries
        run: |
          python3 tools/build-wh1-figure-viewport-v8.py
          python3 tools/build-wh1-library-v9.py
          node --check reader/wh1/all/wh1-figure-viewport-v9.js
          node --check reader/wh1/all/wh1-display-check-v9.js
          node --check reader/library/wh1-reader-routing.js
          node --check reader/library/sw.js
          node --check reader/wh1/all/sw.js
          node --test tests/wh1-figure-viewport-v8.test.cjs tests/wh1-display-check-v9.test.cjs tests/wh1-library-routing.test.cjs tests/wh1-library-build.test.cjs
      - name: Install browser test engines
        run: |
          npm install --prefix /tmp/wh1-v9-browser --no-package-lock playwright@1.56.1
          /tmp/wh1-v9-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Check source-layout clipping and figure to text transitions
        env:
          NODE_PATH: /tmp/wh1-v9-browser/node_modules
        run: node tests/browser-wh1-figure-viewport-v8.cjs
      - name: Store synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wh1-v9-synthetic-layout
          path: wh1-v8-test-results/
          if-no-files-found: ignore
          retention-days: 7

