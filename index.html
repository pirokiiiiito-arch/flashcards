<head>

<style>
:root{--bg:#f4f7fb;--text:#1f2937;--muted:#6b7280;--border:#d9e1ec;--accent:#2f66e8;--soft:#edf2f8;--green:#2e9d57}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{width:min(820px,calc(100% - 24px));margin:24px auto 54px}h1{margin:0 0 18px;font-size:clamp(32px,5vw,48px)}
button,input,textarea{font:inherit}button{cursor:pointer;border:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.topbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.btn{padding:10px 14px;border-radius:12px;background:var(--soft);color:var(--text)}.status{display:flex;justify-content:space-between;margin:0 4px 10px;color:var(--muted);font-size:15px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:min(670px,100%);margin:0 auto 18px}
.nav button{min-height:54px;border-radius:16px;background:#fff;border:1px solid var(--border);color:var(--text);font-weight:800;font-size:17px}
.nav .mode{background:var(--accent);border-color:var(--accent);color:#fff}.nav .mode.normal{background:var(--green);border-color:var(--green)}
.stage{min-height:360px;display:flex;align-items:center;justify-content:center}.card{width:min(670px,100%);height:360px;position:relative;cursor:pointer;touch-action:pan-y;will-change:transform;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.face{position:absolute;inset:0;border:1px solid var(--border);border-radius:28px;background:#fff;box-shadow:0 18px 45px rgba(31,41,55,.08);display:flex;align-items:center;justify-content:center;text-align:center;padding:64px 22px 70px;overflow:hidden}
.back{display:none;background:#fff7ef}.card.show-back .front{display:none}.card.show-back .back{display:flex}
.face-label{position:absolute;top:26px;left:34px;color:var(--muted);font-size:16px;font-weight:800}
.card-text{font-size:clamp(28px,5.2vw,46px);font-weight:850;line-height:1.3;overflow-wrap:anywhere;white-space:pre-wrap}
.back .card-text{width:100%;font-size:clamp(18px,2.8vw,24px);font-weight:700;text-align:center}
.back.multiline .card-text{display:inline-block;width:auto;max-width:26em;margin:0 auto;text-align:left}
.back.size-medium .card-text{font-size:20px;line-height:1.45}.back.size-small .card-text{font-size:17px;line-height:1.42}.back.size-xsmall .card-text{font-size:14px;line-height:1.38}
.back.longtext{align-items:flex-start;overflow-y:auto;padding-top:72px;padding-bottom:34px}.back.longtext .card-text{margin-top:auto;margin-bottom:auto}
.card-actions{position:absolute;top:22px;right:24px;z-index:5;display:flex;gap:8px}.small{padding:8px 12px;border-radius:11px;background:rgba(255,255,255,.96);border:1px solid var(--border);color:var(--text);font-weight:700}
.small.add{color:var(--accent);border-color:#bfd0fb;background:#f4f7ff}.small.save{background:var(--accent);border-color:var(--accent);color:#fff}
.card-number{position:absolute;right:24px;top:76px;z-index:4;color:#aeb7c4;opacity:.65;font-size:13px;pointer-events:none}
.editor{user-select:text;-webkit-user-select:text;width:100%;min-height:150px;border:0;outline:0;resize:none;background:transparent;text-align:center;color:var(--text);font-size:clamp(28px,5.2vw,46px);font-weight:850;line-height:1.3;padding:0;font-family:inherit;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto}
.back .editor{font-size:clamp(18px,2.8vw,24px);font-weight:700;text-align:center}.back.multiline .editor{width:26em;max-width:90%;margin:0 auto;text-align:left}
.back.size-medium .editor{font-size:20px;line-height:1.45}.back.size-small .editor{font-size:17px;line-height:1.42}.back.size-xsmall .editor{font-size:14px;line-height:1.38}
.empty{width:min(670px,100%);min-height:300px;border:1px dashed var(--border);border-radius:28px;background:#fff;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
.empty strong{color:var(--text);font-size:22px}.hint{margin-top:12px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:560px){.wrap{margin-top:16px}.card{height:320px}.face{padding:62px 18px 64px}.face-label{left:20px;top:22px}.card-actions{right:16px;top:16px}.card-number{right:18px;top:72px}.nav{gap:7px}.nav button{font-size:15px;min-height:48px}.topbar .btn{font-size:14px}}

.sync-btn{background:#fff;border:1px solid var(--border)}
.sync-btn.on{background:#e9f7ee;color:#1d7a3d;border-color:#a9d9b9;font-weight:800}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aeb7c4;margin-right:6px}
.sync-btn.on .sync-dot{background:#2e9d57}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,28,40,.38);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal-backdrop.open{display:flex}
.sync-modal{width:min(420px,100%);background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 24px 70px rgba(31,41,55,.22);padding:22px}
.sync-modal h2{margin:0 0 8px;font-size:24px}.sync-modal p{margin:0 0 14px;color:var(--muted);line-height:1.6;font-size:14px}
.sync-modal input{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin:6px 0;background:#fff}
.sync-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sync-row button{flex:1;min-width:120px}
.sync-msg{margin-top:10px;color:var(--muted);font-size:13px;min-height:1.4em;white-space:pre-wrap}
.account-line{font-size:13px;color:var(--muted);margin-bottom:10px}

<body>
<div class="wrap">
<h1>単語帳</h1>
<div class="topbar">
<button id="exportBtn" class="btn">データ保存</button>
<button id="importBtn" class="btn">データ読込</button><input id="importFile" type="file" accept=".json,application/json" hidden>
<button id="excelBtn" class="btn">Excel追加</button><input id="excelFile" type="file" accept=".xlsx,.xls,.csv" hidden>\n<button id="syncBtn" class="btn sync-btn"><span class="sync-dot"></span><span id="syncBtnText">同期ログイン</span></button>
</div>

<div id="syncModalWrap" class="modal-backdrop" aria-hidden="true">
  <div class="sync-modal" role="dialog" aria-modal="true" aria-labelledby="syncTitle">
    <h2 id="syncTitle">クラウド同期</h2>
    <div id="signedOutBox">
      <p>同じメールアドレスとパスワードでログインすると、PC・スマホの単語帳が自動で同期されます。</p>
      <input id="syncEmail" type="email" inputmode="email" autocomplete="email" placeholder="メールアドレス">
      <input id="syncPassword" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）">
      <div class="sync-row">
        <button id="loginBtn" class="btn" type="button">ログイン</button>
        <button id="signupBtn" class="btn" type="button">新規登録</button>\n        <button id="resendBtn" class="btn" type="button">確認メール再送</button>
      </div>
    </div>
    <div id="signedInBox" style="display:none">
      <div id="accountLine" class="account-line"></div>
      <p>この端末はクラウド同期中です。変更は他のログイン済み端末にも反映されます。</p>
      <div class="sync-row">
        <button id="syncNowBtn" class="btn" type="button">今すぐ同期</button>
        <button id="logoutBtn" class="btn" type="button">ログアウト</button>
      </div>
    </div>
    <div id="syncMsg" class="sync-msg"></div>
    <div class="sync-row">
      <button id="closeSyncBtn" class="btn" type="button">閉じる</button>
    </div>
  </div>
</div>

<div class="status"><span id="countText">0件</span><span></span></div>
<div class="nav">
<button id="prevBtn">← 戻る</button><button id="modeBtn" class="mode normal">通常</button><button id="nextBtn">次へ →</button>
</div>
<div id="stage" class="stage"></div>
<div class="hint">タップで表・裏を切替。スマホは左スワイプで次へ、右スワイプで戻ります。</div>
</div>
<script>

const KEY="simple_vocab_cards_v1";
const SESSION_KEY="flashcards_supabase_session_v1";
const SUPABASE_URL="https://himtyybslzzwsfmgdivx.supabase.co";
const SUPABASE_KEY="sb_publishable_tUa2O6wln22qdUk97worCg_Z3vL5bZO";
let cards=loadCards(),order=cards.map((_,i)=>i),pos=0,editing=false,isShuffled=false;
let cloudSession=loadSession(),syncTimer=null,syncBusy=false,lastCloudFingerprint="";
const actionLocks=new Map();
function allowAction(name,ms=280){
  const now=performance.now();
  const last=actionLocks.get(name)||0;
  if(now-last<ms)return false;
  actionLocks.set(name,now);
  return true;
}
function bindSingleAction(el,name,handler,{touchLock=650,clickLock=260}={}){
  let suppressClickUntil=0;
  el.addEventListener("pointerup",e=>{
    if(e.pointerType!=="touch"&&e.pointerType!=="pen")return;
    e.preventDefault();
    suppressClickUntil=Date.now()+900;
    if(!allowAction(name,touchLock))return;
    handler(e);
  });
  el.addEventListener("click",e=>{
    if(Date.now()<suppressClickUntil){
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    if(!allowAction(name,clickLock))return;
    handler(e);
  });
}
const stage=document.getElementById("stage"),countText=document.getElementById("countText");
const syncBtn=document.getElementById("syncBtn"),syncBtnText=document.getElementById("syncBtnText");
const syncModalWrap=document.getElementById("syncModalWrap"),signedOutBox=document.getElementById("signedOutBox"),signedInBox=document.getElementById("signedInBox");
const syncEmail=document.getElementById("syncEmail"),syncPassword=document.getElementById("syncPassword"),syncMsg=document.getElementById("syncMsg"),accountLine=document.getElementById("accountLine");

function loadCards(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(d)?d.filter(x=>x&&typeof x.word==="string"&&typeof x.meaning==="string").map(x=>({
      id:typeof x.id==="string"?x.id:null,
      word:x.word,
      meaning:x.meaning,
      sort_order:Number.isFinite(Number(x.sort_order))?Number(x.sort_order):0,
      updated_at:x.updated_at||null
    })):[];
  }catch{return[]}
}
function saveCards(){localStorage.setItem(KEY,JSON.stringify(cards))}
function loadSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY))||null}catch{return null}}
function saveSession(s){
  cloudSession=s;
  if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SESSION_KEY);
  updateSyncUI();
}
function updateSyncUI(){
  const on=!!cloudSession?.access_token;
  syncBtn?.classList.toggle("on",on);
  if(syncBtnText)syncBtnText.textContent=on?"同期中":"同期ログイン";
  if(signedOutBox)signedOutBox.style.display=on?"none":"block";
  if(signedInBox)signedInBox.style.display=on?"block":"none";
  if(accountLine)accountLine.textContent=on?(cloudSession?.user?.email||"ログイン済み"):"";if(countText)countText.textContent=cards.length+"件"+(on?"":"（未同期）");
}
function setSyncMsg(msg){if(syncMsg)syncMsg.textContent=msg||""}
function openSync(){updateSyncUI();setSyncMsg("");syncModalWrap.classList.add("open");syncModalWrap.setAttribute("aria-hidden","false")}
function closeSync(){syncModalWrap.classList.remove("open");syncModalWrap.setAttribute("aria-hidden","true")}
syncBtn.onclick=openSync;
closeSyncBtn.onclick=closeSync;
syncModalWrap.addEventListener("click",e=>{if(e.target===syncModalWrap)closeSync()});

async function rawAuth(path,body){
  const r=await fetch(SUPABASE_URL+path,{
    method:"POST",
    headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.msg||data.message||data.error_description||"認証に失敗しました。");
  return data;
}
function normalizeSession(data){
  const now=Date.now();
  return {
    access_token:data.access_token,
    refresh_token:data.refresh_token,
    expires_at:now+(Number(data.expires_in||3600)*1000),
    user:data.user||cloudSession?.user||null
  };
}
async function ensureSession(){
  if(!cloudSession?.access_token)return null;
  if((cloudSession.expires_at||0)>Date.now()+60000)return cloudSession;
  if(!cloudSession.refresh_token){saveSession(null);return null}
  try{
    const data=await rawAuth("/auth/v1/token?grant_type=refresh_token",{refresh_token:cloudSession.refresh_token});
    saveSession(normalizeSession(data));
    return cloudSession;
  }catch(e){saveSession(null);stopSyncLoop();return null}
}
async function api(path,{method="GET",body,headers={}}={}){
  const s=await ensureSession();
  if(!s)throw new Error("同期ログインが必要です。");
  const h={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+s.access_token,...headers};
  if(body!==undefined)h["Content-Type"]="application/json";
  const r=await fetch(SUPABASE_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  const text=await r.text();
  let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
  if(!r.ok)throw new Error(data?.message||data?.hint||data?.details||"同期に失敗しました。");
  return data;
}
async function signUp(){
  const email=syncEmail.value.trim(),password=syncPassword.value;
  if(!email||password.length<6){setSyncMsg("メールアドレスと6文字以上のパスワードを入力してください。");return}
  try{
    setSyncMsg("登録中…");
    const data=await rawAuth("/auth/v1/signup?redirect_to="+encodeURIComponent("https://pirokiiiiito-arch.github.io/flashcards/"),{email,password});
    if(data.access_token){
      saveSession(normalizeSession(data));
      await afterLogin();
      setSyncMsg("登録して同期を開始しました。");
    }else{
      setSyncMsg("確認メールを送りました。メール確認後、この画面からログインしてください。");
    }
  }catch(e){setSyncMsg(e.message)}
}
async function signIn(){
  const email=syncEmail.value.trim(),password=syncPassword.value;
  if(!email||!password){setSyncMsg("メールアドレスとパスワードを入力してください。");return}
  try{
    setSyncMsg("ログイン中…");
    const data=await rawAuth("/auth/v1/token?grant_type=password",{email,password});
    saveSession(normalizeSession(data));
    await afterLogin();
    setSyncMsg("同期を開始しました。");
  }catch(e){setSyncMsg(e.message)}
}
async function signOut(){
  try{
    const s=await ensureSession();
    if(s)await fetch(SUPABASE_URL+"/auth/v1/logout",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+s.access_token}});
  }catch{}
  stopSyncLoop();saveSession(null);setSyncMsg("ログアウトしました。");
}
async function resendConfirmation(){
  const email=syncEmail.value.trim();
  if(!email){setSyncMsg("メールアドレスを入力してください。");return}
  try{
    setSyncMsg("確認メールを再送しています…");
    const r=await fetch(SUPABASE_URL+"/auth/v1/resend?redirect_to="+encodeURIComponent("https://pirokiiiiito-arch.github.io/flashcards/"),{
      method:"POST",
      headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({type:"signup",email})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.msg||data.message||"再送に失敗しました。");
    setSyncMsg("確認メールを再送しました。新しいメールのリンクを開いてください。");
  }catch(e){setSyncMsg(e.message)}
}
loginBtn.onclick=signIn;signupBtn.onclick=signUp;resendBtn.onclick=resendConfirmation;logoutBtn.onclick=signOut;
syncNowBtn.onclick=async()=>{try{setSyncMsg("端末とクラウドを統合中…");await migrateLocalToCloud();await syncPull(true);setSyncMsg("同期しました。端末とクラウドの件数を揃えました。")}catch(e){setSyncMsg(e.message)}};

function rebuildOrder(){order=cards.map((_,i)=>i);pos=Math.min(pos,Math.max(0,order.length-1));isShuffled=false;updateMode()}
function currentIndex(){return order.length?order[pos]:-1}
function updateMode(){const b=document.getElementById("modeBtn");b.textContent=isShuffled?"シャッフル":"通常";b.classList.toggle("normal",!isShuffled)}
function updateNav(){const d=!cards.length||editing;prevBtn.disabled=d;nextBtn.disabled=d;modeBtn.disabled=cards.length<2||editing;[prevBtn,nextBtn,modeBtn].forEach(b=>{b.style.opacity=b.disabled?".45":"1"})}
function applyBackClasses(back,text){const n=text.length;back.classList.toggle("multiline",text.includes("\n"));back.classList.toggle("size-medium",n>160&&n<=300);back.classList.toggle("size-small",n>300&&n<=500);back.classList.toggle("size-xsmall",n>500);back.classList.toggle("longtext",n>160)}
function render(){editing=false;stage.innerHTML="";countText.textContent=cards.length+"件"+(cloudSession?.access_token?"":"（未同期）");if(!cards.length){const e=document.createElement("div");e.className="empty";e.innerHTML="<strong>カードがありません</strong><div>カードを追加してください。</div>";const b=document.createElement("button");b.className="btn";b.textContent="＋ カード追加";b.onclick=showDraft;e.appendChild(b);stage.appendChild(e);updateNav();updateMode();return}renderCard(cards[currentIndex()]);updateNav();updateMode()}

function maxSortOrder(){return cards.reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),0)}
function nextSortOrder(){return Math.max(maxSortOrder()+1,Date.now()*1000)}

async function cloudInsert(items){
  if(!cloudSession||!items.length)return items;
  const userId=cloudSession.user?.id;
  const rows=items.map((x,i)=>({user_id:userId,word:x.word,meaning:x.meaning,sort_order:Number(x.sort_order)||nextSortOrder()+i,updated_at:new Date().toISOString()}));
  return await api("/rest/v1/flashcards_sync",{method:"POST",body:rows,headers:{"Prefer":"return=representation"}});
}
async function cloudUpdate(item){
  if(!cloudSession||!item.id)return;
  await api("/rest/v1/flashcards_sync?id=eq."+encodeURIComponent(item.id),{
    method:"PATCH",
    body:{word:item.word,meaning:item.meaning,sort_order:Number(item.sort_order)||0,updated_at:new Date().toISOString()},
    headers:{"Prefer":"return=minimal"}
  });
}
async function cloudDelete(item){
  if(!cloudSession||!item?.id)return;
  await api("/rest/v1/flashcards_sync?id=eq."+encodeURIComponent(item.id),{method:"DELETE",headers:{"Prefer":"return=minimal"}});
}
async function fetchCloudCards(){
  if(!cloudSession)return [];
  const rows=await api("/rest/v1/flashcards_sync?select=id,word,meaning,sort_order,updated_at&order=sort_order.asc",{method:"GET"});
  return (rows||[]).map(x=>({id:x.id,word:x.word,meaning:x.meaning,sort_order:Number(x.sort_order)||0,updated_at:x.updated_at||null}));
}
function fingerprint(list){return JSON.stringify(list.map(x=>[x.id,x.word,x.meaning,x.sort_order,x.updated_at]))}
async function restoreSeedCards(){
  if(!cloudSession?.access_token)return;
  const s=await ensureSession();
  if(!s)return;
  const r=await fetch(SUPABASE_URL+"/functions/v1/restore-flashcards",{
    method:"POST",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+s.access_token,
      "Content-Type":"application/json"
    },
    body:"{}"
  });
  if(!r.ok){
    const t=await r.text();
    throw new Error(t||"復元データの同期に失敗しました。");
  }
}

async function migrateLocalToCloud(){
  const remote=await fetchCloudCards();
  const local=cards.slice();
  if(remote.length===0&&local.length){
    let base=Date.now()*1000;
    const pending=local.map((x,i)=>({word:x.word,meaning:x.meaning,sort_order:x.sort_order||base+i}));
    const inserted=await cloudInsert(pending);
    cards=(inserted||[]).map(x=>({id:x.id,word:x.word,meaning:x.meaning,sort_order:Number(x.sort_order)||0,updated_at:x.updated_at||null}));
    saveCards();rebuildOrder();render();lastCloudFingerprint=fingerprint(cards);return;
  }
  if(remote.length){
    const keys=new Set(remote.map(x=>x.word+"\u0000"+x.meaning));
    const missing=local.filter(x=>!keys.has(x.word+"\u0000"+x.meaning));
    if(missing.length){
      let base=Math.max(remote.reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),0)+1,Date.now()*1000);
      await cloudInsert(missing.map((x,i)=>({word:x.word,meaning:x.meaning,sort_order:base+i})));
    }
    cards=await fetchCloudCards();saveCards();rebuildOrder();render();lastCloudFingerprint=fingerprint(cards);
  }
}
async function afterLogin(){
  updateSyncUI();
  await migrateLocalToCloud();
  startSyncLoop();
}
async function syncPull(force=false){
  if(!cloudSession||editing||syncBusy)return;
  syncBusy=true;
  try{
    const keepId=cards[currentIndex()]?.id||null;
    const remote=await fetchCloudCards();
    const fp=fingerprint(remote);
    if(force||fp!==lastCloudFingerprint){
      cards=remote;saveCards();rebuildOrder();
      if(keepId){const i=cards.findIndex(x=>x.id===keepId);if(i>=0)pos=i}
      render();lastCloudFingerprint=fp;
    }
  }finally{syncBusy=false}
}
function startSyncLoop(){
  stopSyncLoop();
  if(!cloudSession)return;
  syncTimer=setInterval(()=>syncPull(false).catch(()=>{}),3000);
}
function stopSyncLoop(){if(syncTimer){clearInterval(syncTimer);syncTimer=null}}
window.addEventListener("focus",()=>syncPull(false).catch(()=>{}));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncPull(false).catch(()=>{})});

function renderCard(item){
 const idx=currentIndex(),card=document.createElement("article");card.className="card";
 const front=document.createElement("div");front.className="face front";const back=document.createElement("div");back.className="face back";
 const fl=document.createElement("div");fl.className="face-label";fl.textContent="表・単語";const bl=document.createElement("div");bl.className="face-label";bl.textContent="裏・意味";
 const ft=document.createElement("div");ft.className="card-text";ft.textContent=item.word;const bt=document.createElement("div");bt.className="card-text";bt.textContent=item.meaning;applyBackClasses(back,item.meaning);
 front.append(fl,ft);back.append(bl,bt);card.append(front,back);
 const actions=document.createElement("div");actions.className="card-actions";
 const add=document.createElement("button");add.className="small add";add.textContent="＋追加";
 const edit=document.createElement("button");edit.className="small";edit.textContent="編集";
 const del=document.createElement("button");del.className="small";del.textContent="削除";
 actions.append(add,edit,del);card.appendChild(actions);
 const num=document.createElement("div");num.className="card-number";num.textContent=(pos+1)+" / "+cards.length;card.appendChild(num);stage.appendChild(card);
 let swipeStartX=0,swipeStartY=0,swipePointerId=null,swipeMoved=false,suppressClickUntil=0,touchTapHandled=false;
 card.addEventListener("pointerdown",e=>{
   if(editing||e.pointerType==="mouse"||e.target.closest("button,textarea,input"))return;
   swipePointerId=e.pointerId;
   swipeStartX=e.clientX;
   swipeStartY=e.clientY;
   swipeMoved=false;
   try{card.setPointerCapture(e.pointerId)}catch{}
 });
 card.addEventListener("pointermove",e=>{
   if(swipePointerId!==e.pointerId||editing)return;
   const dx=e.clientX-swipeStartX;
   const dy=e.clientY-swipeStartY;
   if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.15){
     swipeMoved=true;
     const follow=Math.max(-44,Math.min(44,dx*0.22));
     card.style.transform="translateX("+follow+"px)";
   }
 });
 function finishSwipe(e){
   if(swipePointerId!==e.pointerId)return;
   const dx=e.clientX-swipeStartX;
   const dy=e.clientY-swipeStartY;
   const horizontal=Math.abs(dx)>=55&&Math.abs(dx)>Math.abs(dy)*1.2;
   const simpleTap=Math.abs(dx)<12&&Math.abs(dy)<12;
   const isTouch=e.pointerType==="touch"||e.pointerType==="pen";
   card.style.transform="";
   try{card.releasePointerCapture(e.pointerId)}catch{}
   swipePointerId=null;
   if(isTouch)e.preventDefault();
   if(horizontal&&!editing&&cards.length){
     suppressClickUntil=Date.now()+900;
     touchTapHandled=isTouch;
     if(dx<0){
       pos=(pos+1)%order.length;
     }else{
       pos=(pos-1+order.length)%order.length;
     }
     render();
   }else if(isTouch&&simpleTap&&!editing){
     suppressClickUntil=Date.now()+900;
     touchTapHandled=true;
     if(allowAction("card-touch-toggle",650))card.classList.toggle("show-back");
   }else if(swipeMoved){
     suppressClickUntil=Date.now()+500;
   }
 }
 card.addEventListener("pointerup",finishSwipe);
 card.addEventListener("pointercancel",e=>{
   if(swipePointerId===e.pointerId){
     card.style.transform="";
     swipePointerId=null;
   }
 });
 card.addEventListener("click",e=>{
   if(editing||Date.now()<suppressClickUntil||touchTapHandled)return;
   if(e.target.closest("button,textarea,input"))return;
   if(!allowAction("card-click-toggle",320))return;
   card.classList.toggle("show-back");
 });
 card.addEventListener("selectstart",e=>{
   if(!editing&&!e.target.closest("textarea,input"))e.preventDefault();
 });
 card.addEventListener("dblclick",e=>{
   if(!editing&&!e.target.closest("textarea,input"))e.preventDefault();
 });
 add.onclick=e=>{e.stopPropagation();if(!editing)showDraft()};
 edit.onclick=e=>{e.stopPropagation();if(editing){saveEdit()}else startEdit()};
 del.onclick=async e=>{
   e.stopPropagation();
   if(editing){render();return}
   if(confirm("「"+item.word+"」を削除しますか？")){
     try{await cloudDelete(item)}catch(err){alert(err.message);return}
     cards.splice(idx,1);saveCards();rebuildOrder();if(pos>=order.length)pos=Math.max(0,order.length-1);render();
     lastCloudFingerprint="";
   }
 };
 let fe=null,be=null;
 function startEdit(){editing=true;fe=document.createElement("textarea");fe.className="editor";fe.value=item.word;be=document.createElement("textarea");be.className="editor";be.value=item.meaning;ft.replaceWith(fe);bt.replaceWith(be);applyBackClasses(back,be.value);be.oninput=()=>applyBackClasses(back,be.value);[fe,be].forEach(x=>x.onclick=e=>e.stopPropagation());edit.textContent="保存";edit.classList.add("save");del.textContent="取消";updateNav();setTimeout(()=>{(card.classList.contains("show-back")?be:fe).focus()},30)}
 async function saveEdit(){
   const w=fe.value.trim(),m=be.value.trim();if(!w||!m){alert("単語と意味の両方を入力してください。");return}
   const changed={...item,word:w,meaning:m,updated_at:new Date().toISOString()};
   try{
     if(cloudSession){
       if(!changed.id){const ins=await cloudInsert([changed]);if(ins?.[0])Object.assign(changed,ins[0])}
       else await cloudUpdate(changed);
     }
     cards[idx]=changed;saveCards();lastCloudFingerprint="";render();
   }catch(err){alert(err.message)}
 }
}

function showDraft(){
 editing=true;stage.innerHTML="";const card=document.createElement("article");card.className="card";const front=document.createElement("div");front.className="face front",back=document.createElement("div");back.className="face back";
 const fl=document.createElement("div");fl.className="face-label";fl.textContent="表・単語";const bl=document.createElement("div");bl.className="face-label";bl.textContent="裏・意味";
 const fe=document.createElement("textarea");fe.className="editor";fe.placeholder="単語を入力";const be=document.createElement("textarea");be.className="editor";be.placeholder="意味を入力";front.append(fl,fe);back.append(bl,be);card.append(front,back);
 const a=document.createElement("div");a.className="card-actions";const s=document.createElement("button");s.className="small save";s.textContent="保存";const c=document.createElement("button");c.className="small";c.textContent="取消";a.append(s,c);card.appendChild(a);stage.appendChild(card);
 be.oninput=()=>applyBackClasses(back,be.value);card.onclick=e=>{if(e.target!==fe&&e.target!==be)card.classList.toggle("show-back")};
 s.onclick=async e=>{
   e.stopPropagation();const w=fe.value.trim(),m=be.value.trim();if(!w||!m){alert("単語と意味の両方を入力してください。");return}
   let item={word:w,meaning:m,sort_order:nextSortOrder(),updated_at:new Date().toISOString()};
   try{
     if(cloudSession){const ins=await cloudInsert([item]);if(ins?.[0])item={id:ins[0].id,word:ins[0].word,meaning:ins[0].meaning,sort_order:Number(ins[0].sort_order)||item.sort_order,updated_at:ins[0].updated_at||item.updated_at}}
     cards.push(item);saveCards();rebuildOrder();pos=cards.length-1;lastCloudFingerprint="";render();
   }catch(err){alert(err.message)}
 };
 c.onclick=e=>{e.stopPropagation();render()};updateNav();setTimeout(()=>fe.focus(),30)
}

bindSingleAction(prevBtn,"prev",()=>{if(!cards.length||editing)return;pos=(pos-1+order.length)%order.length;render()});
bindSingleAction(nextBtn,"next",()=>{if(!cards.length||editing)return;pos=(pos+1)%order.length;render()});
bindSingleAction(modeBtn,"mode",()=>{if(cards.length<2||editing)return;if(isShuffled){order=cards.map((_,i)=>i);pos=0;isShuffled=false}else{order=cards.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;isShuffled=true}render()},{touchLock:800,clickLock:450});

exportBtn.onclick=()=>{const simple=cards.map(x=>({word:x.word,meaning:x.meaning}));const blob=new Blob([JSON.stringify(simple,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="tangocho-data.json";a.click();URL.revokeObjectURL(u)};
importBtn.onclick=()=>importFile.click();
importFile.onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(!Array.isArray(d))throw 0;
    const incoming=d.filter(x=>x&&typeof x.word==="string"&&typeof x.meaning==="string").map((x,i)=>({word:x.word.trim(),meaning:x.meaning.trim(),sort_order:Date.now()*1000+i})).filter(x=>x.word&&x.meaning);
    if(cloudSession){
      await api("/rest/v1/flashcards_sync?user_id=eq."+encodeURIComponent(cloudSession.user.id),{method:"DELETE",headers:{"Prefer":"return=minimal"}});
      const ins=await cloudInsert(incoming);
      cards=(ins||[]).map(x=>({id:x.id,word:x.word,meaning:x.meaning,sort_order:Number(x.sort_order)||0,updated_at:x.updated_at||null}));
    }else cards=incoming;
    saveCards();rebuildOrder();pos=0;lastCloudFingerprint="";render();
  }catch(err){alert(err?.message||"読み込めないファイルです。")}
  e.target.value="";
};

excelBtn.onclick=()=>excelFile.click();
excelFile.onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    let rows=[];
    if(f.name.toLowerCase().endsWith(".csv"))rows=(await f.text()).split(/\r?\n/).filter(Boolean).map(r=>r.split(","));
    else{if(typeof XLSX==="undefined")throw 0;const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""})}
    if(!rows.length)throw 0;
    const a=String(rows[0]?.[0]??"").trim().toLowerCase(),b=String(rows[0]?.[1]??"").trim().toLowerCase();
    if(["単語","表","word","front","問題"].includes(a)||["意味","裏","meaning","back","答え"].includes(b))rows=rows.slice(1);
    const base=nextSortOrder();
    const added=rows.map((r,i)=>({word:String(r?.[0]??"").trim(),meaning:String(r?.[1]??"").trim(),sort_order:base+i})).filter(x=>x.word&&x.meaning);
    if(!added.length){alert("A列に単語、B列に意味を入力してください。");return}
    if(cloudSession){
      const ins=await cloudInsert(added);
      cards.push(...(ins||[]).map(x=>({id:x.id,word:x.word,meaning:x.meaning,sort_order:Number(x.sort_order)||0,updated_at:x.updated_at||null})));
    }else cards.push(...added);
    saveCards();rebuildOrder();pos=Math.max(0,cards.length-added.length);lastCloudFingerprint="";render();alert(added.length+"枚のカードを追加しました。");
  }catch(err){alert(err?.message||"Excelファイルを読み込めませんでした。")}
  e.target.value="";
};

rebuildOrder();render();updateSyncUI();
(async()=>{if(cloudSession){try{await ensureSession();if(cloudSession){await migrateLocalToCloud();startSyncLoop()}}catch{}}})();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));

</script>
